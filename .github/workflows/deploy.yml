name: Deploy Vite React to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Enfileira deploys em vez de cancelar um em andamento: publicação de página
# não deve ser interrompida no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # IMPORTANTE: para este workflow publicar o site, é preciso mudar em
  # Settings → Pages a opção "Source" de "Deploy from a branch" para
  # "GitHub Actions". Enquanto isso não for feito, o Pages continua servindo
  # o conteúdo antigo (main → /docs) e este job roda sem efeito visível.
  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # A base do Vite (`/portfolio-prxdev/`, definida em vite.config.ts)
      # precisa ser exatamente o nome deste repositório, senão os assets
      # publicados quebram no ar.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
